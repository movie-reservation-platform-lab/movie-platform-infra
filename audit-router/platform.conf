[SERVICE]
    Flush 1
    Grace 110
    Log_Level info
    Parsers_File /fluent-bit/platform/parsers.conf
    storage.path /var/log/fluent-bit
    storage.sync normal
    storage.checksum on
    storage.max_chunks_up 16
    storage.backlog.mem_limit 8M
    HTTP_Server On
    HTTP_Listen 127.0.0.1
    HTTP_Port 2020

[INPUT]
    Name forward
    unix_path /var/run/fluent.sock
    storage.type filesystem
    Mem_Buf_Limit 8M
    Buffer_Max_Size 64K

@INCLUDE /fluent-bit/platform/routing.conf

[OUTPUT]
    Name kinesis_firehose
    Match audit
    region ${AWS_REGION}
    delivery_stream ${AUDIT_DELIVERY_STREAM}
    auto_retry_requests On
    Retry_Limit False
    storage.total_limit_size 512M

[OUTPUT]
    Name cloudwatch_logs
    Match rejected
    region ${AWS_REGION}
    log_group_name ${ROUTER_LOG_GROUP}
    log_stream_prefix rejected-
    log_key log
    auto_create_group Off
    Retry_Limit False
    storage.total_limit_size 16M

[OUTPUT]
    Name cloudwatch_logs
    Match movie-reservation-web-firelens-*
    region ${AWS_REGION}
    log_group_name /movie-platform/aws-demo/reservation-web/app
    log_stream_prefix reservation-web-
    log_key log
    auto_create_group Off
    Retry_Limit False
    storage.total_limit_size 64M

