[FILTER]
    Name parser
    Match *-firelens-*
    Key_Name log
    Parser platform_json
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name lua
    Match *-firelens-*
    script /fluent-bit/platform/route.lua
    call route_record
    protected_mode On
    time_as_table On

[FILTER]
    Name rewrite_tag
    Match *-firelens-*
    Rule $_audit_route ^audit$ audit false
    Rule $_audit_route ^rejected$ rejected false
    Emitter_Name audit_routes
    Emitter_Storage.type filesystem
    Emitter_Mem_Buf_Limit 8M

[FILTER]
    Name modify
    Match *
    Remove _audit_route
