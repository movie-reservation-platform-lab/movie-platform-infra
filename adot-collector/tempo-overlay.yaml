# Loaded only by enableTempo. Base traces pipeline still exports to X-Ray.
exporters:
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 128
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  pipelines:
    traces/tempo:
      receivers: [otlp/reservation_service, otlp/reservation_agent, otlp/recommendation_mcp, otlp/recommendation_service]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
