multitenancy_enabled: false
server:
  http_listen_port: 3200
  log_level: info
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
usage_report:
  reporting_enabled: false

# Service graphs and span metrics are stored in the retained AMP workspace.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      deployment_environment: aws-demo
  processor:
    service_graphs:
      wait: 10s
      max_items: 1000
  storage:
    path: /tmp/tempo/generator/wal
    remote_write_add_org_id_header: false
    remote_write:
      - url: ${AMP_REMOTE_WRITE_ENDPOINT}
        sigv4:
          region: ${AWS_REGION}
  traces_storage:
    path: /tmp/tempo/generator/traces
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
