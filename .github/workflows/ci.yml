name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validates reusable packages and the dependency rules that keep them
  # independent from deployable apps and operator automation.
  packages:
    name: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace dependency direction
        run: npm run validate:workspace-boundaries

      - name: Test workspace dependency rules
        run: npm run test:workspace-boundaries

      - name: Validate AWS account preflight package
        run: npm run validate:aws-account-preflight

      - name: Validate audit-account configuration package
        run: npm run validate:audit-account-config

      - name: Validate reusable audit-ingestion package
        run: npm run validate:audit-ingestion

  # Validates repository-owned operational commands after their reusable
  # package dependencies have passed.
  automation:
    name: automation
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate audit-account operator
        run: npm run validate:audit-account-operator

      - name: Validate artifact-foundation cleanup automation
        run: npm run validate:artifact-foundation-cleanup

      - name: Validate artifact-copy automation
        run: npm run validate:artifact-copy

  # Builds and tests the deployable apps and the root CDK infrastructure.
  infra:
    name: apps and root infrastructure
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build root CDK infrastructure
        run: npm run build:root

      - name: Build deployable app workspaces
        run: npm run build:apps

      - name: Run workload CDK assertion tests
        run: npm run test:cdk:workload

      - name: Run artifact-foundation CDK assertion tests
        run: npm run test:cdk:foundation

      - name: Run GitHub OIDC trust and admission permission tests
        run: npm run test:cdk:github-oidc-trust

      - name: Run audit and observability foundation tests
        run: npm run test:cdk:audit-foundations

      - name: Run audit-account foundation tests
        run: npm run test:cdk:audit-account

      - name: Run Security Lake audit-ingestion tests
        run: npm run test:cdk:security-lake-audit-ingestion

  # Validates repository tooling that supports deployability and operations,
  # including image, smoke-test, metrics, and dashboard checks.
  tooling:
    name: tooling
    needs: automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository-tooling tests
        run: npm run test:tooling

      - name: Validate ADOT image
        run: npm run validate:adot-image

      - name: Validate real ADOT to Tempo trace path without AWS network
        run: npm run validate:tempo-image

      - name: Validate audit router with real Fluent Bit and no AWS network
        run: npm run validate:audit-router

      - name: Validate X-Ray smoke tooling
        run: npm run validate:xray-smoke

      - name: Validate managed-metrics smoke tooling
        run: npm run validate:managed-metrics-smoke

      - name: Validate integrated-demo smoke tooling
        run: npm run validate:integrated-demo-smoke

      - name: Validate Grafana dashboard
        run: npm run validate:grafana-dashboard

      - name: Evaluate service alert PromQL against synthetic scenarios
        run: npm run validate:service-promql

  # Synthesizes offline CDK contracts only after infra and tooling checks pass,
  # proving the repository can produce deployable CloudFormation templates.
  synth:
    name: synth
    needs:
      - infra
      - tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workload offline synth contract
        run: npm run synth:ecr-contract

      - name: Run artifact-foundation offline synth contract
        run: npm run synth:artifact-foundation

      - name: Run GitHub OIDC trust offline synth contract
        run: npm run synth:github-oidc-trust

      - name: Synthesize independent audit foundation
        run: npm run synth:audit

      - name: Synthesize audit-account foundation
        run: npm run synth:audit-account

      - name: Synthesize Security Lake audit ingestion
        run: npm run synth:security-lake-audit-ingestion

      - name: Synthesize independent observability foundation
        run: npm run synth:observability
